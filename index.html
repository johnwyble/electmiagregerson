<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Campaign Website">
    <title>Campaign Website</title>
    <style>
        /* CSS Custom Properties - Override by JavaScript */
        :root {
            --color-primary: #003d5c;
            --color-secondary: #00a399;
            --color-accent: #d4a574;
            --color-background: #faf8f5;
            --color-surface: #f5f3f0;
            --color-text: #1a1a1a;
            --color-text-light: #4a4a4a;
            --color-text-muted: #7a7a7a;

            --font-heading: "Georgia", serif;
            --font-body: "Segoe UI", sans-serif;

            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 2rem;
            --spacing-lg: 3rem;
            --spacing-xl: 4rem;
            --spacing-2xl: 5rem;

            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);

            --radius: 8px;
            --radius-lg: 12px;

            --transition-default: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            color: var(--color-text);
            background-color: var(--color-background);
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
            line-height: 1.2;
            font-weight: 700;
        }

        h1 { font-size: 3rem; }
        h2 { font-size: 2.5rem; }
        h3 { font-size: 1.75rem; }
        h4 { font-size: 1.5rem; }
        h5 { font-size: 1.25rem; }
        h6 { font-size: 1rem; }

        p {
            margin-bottom: var(--spacing-md);
        }

        a {
            color: var(--color-secondary);
            text-decoration: none;
            transition: var(--transition-default);
        }

        a:hover {
            color: var(--color-primary);
        }

        button, .button {
            display: inline-block;
            padding: var(--spacing-sm) var(--spacing-lg);
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-default);
            text-decoration: none;
            text-align: center;
        }

        button:hover, .button:hover {
            background-color: var(--color-secondary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        button:active, .button:active {
            transform: translateY(0);
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: white;
            z-index: 1000;
            transition: var(--transition-default);
            padding: var(--spacing-md) var(--spacing-lg);
        }

        nav.scrolled {
            box-shadow: var(--shadow-md);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-primary);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: var(--spacing-lg);
            align-items: center;
        }

        .nav-links a {
            color: var(--color-text);
            font-weight: 500;
            transition: var(--transition-default);
        }

        .nav-links a:hover {
            color: var(--color-secondary);
        }

        .nav-cta {
            background-color: var(--color-accent);
            color: var(--color-primary);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius);
            font-weight: 600;
        }

        .nav-cta:hover {
            background-color: var(--color-primary);
            color: white;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .hamburger span {
            width: 24px;
            height: 3px;
            background-color: var(--color-primary);
            margin: 4px 0;
            border-radius: 2px;
            transition: var(--transition-default);
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(10px, 10px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        /* Main Content */
        main {
            margin-top: 80px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
        }

        section {
            padding: var(--spacing-2xl) 0;
        }

        section:nth-child(odd) {
            background-color: var(--color-background);
        }

        section:nth-child(even) {
            background-color: var(--color-surface);
        }

        .section-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .section-title {
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--color-secondary);
            margin-bottom: var(--spacing-sm);
        }

        .section-headline {
            font-size: 2.5rem;
            color: var(--color-primary);
            margin-bottom: var(--spacing-md);
        }

        .section-intro {
            font-size: 1.125rem;
            color: var(--color-text-light);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Hero Section */
        .hero {
            padding: 0;
            margin-top: 80px;
        }

        .hero-container {
            position: relative;
            overflow: hidden;
        }

        /* Hero: Full Bleed */
        .hero.full-bleed {
            min-height: 600px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: var(--spacing-2xl);
        }

        .hero.full-bleed::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.5) 100%);
            z-index: 1;
        }

        .hero.full-bleed .hero-content {
            position: relative;
            z-index: 2;
            color: white;
            text-align: left;
            max-width: 600px;
        }

        /* Hero: Split Left */
        .hero.split-left {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            min-height: 500px;
        }

        .hero.split-left .hero-image {
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        .hero.split-left .hero-content {
            padding: var(--spacing-2xl);
        }

        /* Hero: Split Right */
        .hero.split-right {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            min-height: 500px;
        }

        .hero.split-right .hero-image {
            order: 2;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        .hero.split-right .hero-content {
            padding: var(--spacing-2xl);
        }

        /* Hero: Centered */
        .hero.centered {
            min-height: 600px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-2xl);
            position: relative;
        }

        .hero.centered::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 61, 92, 0.4);
            z-index: 1;
        }

        .hero.centered .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            max-width: 700px;
        }

        /* Hero: Diagonal */
        .hero.diagonal {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            min-height: 500px;
            position: relative;
            overflow: hidden;
        }

        .hero.diagonal .hero-image {
            height: 100%;
            background-size: cover;
            background-position: center;
            clip-path: polygon(0 0, 100% 0, 70% 100%, 0 100%);
        }

        .hero.diagonal .hero-content {
            padding: var(--spacing-2xl);
            padding-left: var(--spacing-xl);
        }

        .hero-headline {
            font-size: 3.5rem;
            margin-bottom: var(--spacing-md);
            line-height: 1.1;
        }

        .hero-subheadline {
            font-size: 1.375rem;
            margin-bottom: var(--spacing-lg);
            font-weight: 400;
            opacity: 0.95;
        }

        .hero .button {
            background-color: var(--color-accent);
            color: var(--color-primary);
            font-weight: 600;
            padding: var(--spacing-sm) var(--spacing-xl);
        }

        .hero .button:hover {
            background-color: var(--color-primary);
            color: white;
        }

        /* About Section */
        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-xl);
            align-items: center;
        }

        .about-text h3 {
            color: var(--color-primary);
            margin-bottom: var(--spacing-md);
        }

        .about-text {
            display: flex;
            flex-direction: column;
        }

        .about-photo {
            width: 100%;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .about-photo img {
            width: 100%;
            height: auto;
            display: block;
        }

        .about-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-lg);
            margin-top: var(--spacing-lg);
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--color-secondary);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Accomplishments Section */
        .accomplishments-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-2xl);
        }

        .accomplishment-item {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-xl);
            align-items: center;
        }

        .accomplishment-item:nth-child(even) {
            direction: rtl;
        }

        .accomplishment-item:nth-child(even) > * {
            direction: ltr;
        }

        .accomplishment-content h3 {
            color: var(--color-primary);
            font-size: 1.75rem;
            margin-bottom: var(--spacing-md);
        }

        .accomplishment-icon {
            font-size: 2.5rem;
            margin-right: var(--spacing-sm);
            display: inline-block;
        }

        .accomplishment-photo {
            width: 100%;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .accomplishment-photo img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Gallery Section */
        .gallery-grid {
            column-count: 4;
            column-gap: var(--spacing-lg);
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: var(--spacing-lg);
            overflow: hidden;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: var(--transition-default);
        }

        .gallery-item:hover {
            transform: scale(1.02);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: var(--transition-default);
        }

        .gallery-item:hover img {
            filter: brightness(0.85);
        }

        /* Issues Section */
        .issues-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: var(--spacing-xl);
        }

        .issue-card {
            background-color: white;
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            transition: var(--transition-default);
        }

        .issue-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .issue-icon {
            font-size: 2rem;
            margin-bottom: var(--spacing-md);
        }

        .issue-card h4 {
            color: var(--color-primary);
            margin-bottom: var(--spacing-sm);
        }

        /* Endorsements Section */
        /* Endorsements: Cards */
        .endorsements.cards .endorsements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--spacing-lg);
        }

        .endorsement-card {
            background-color: white;
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            text-align: center;
            transition: var(--transition-default);
        }

        .endorsement-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .endorsement-photo {
            width: 120px;
            height: 120px;
            margin: 0 auto var(--spacing-md);
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--color-secondary);
        }

        .endorsement-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .endorsement-card .name {
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: var(--spacing-xs);
        }

        .endorsement-card .title {
            font-size: 0.875rem;
            color: var(--color-text-muted);
            margin-bottom: var(--spacing-md);
        }

        .endorsement-card .quote {
            font-style: italic;
            color: var(--color-text-light);
            line-height: 1.7;
        }

        /* Endorsements: Quotes */
        .endorsements.quotes .endorsements-grid {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xl);
        }

        .endorsement-quote {
            border-left: 4px solid var(--color-accent);
            padding-left: var(--spacing-lg);
            padding-top: var(--spacing-md);
            padding-bottom: var(--spacing-md);
        }

        .endorsement-quote .quote {
            font-size: 1.125rem;
            font-style: italic;
            color: var(--color-primary);
            margin-bottom: var(--spacing-md);
        }

        .endorsement-quote .name {
            font-weight: 700;
            color: var(--color-text);
        }

        .endorsement-quote .title {
            font-size: 0.875rem;
            color: var(--color-text-muted);
        }

        /* Endorsements: Grid */
        .endorsements.grid .endorsements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-lg);
        }

        .endorsement-grid-item {
            text-align: center;
        }

        .endorsement-grid-item .photo {
            width: 150px;
            height: 150px;
            margin: 0 auto var(--spacing-md);
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--color-secondary);
        }

        .endorsement-grid-item .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Endorsements: List */
        .endorsements.list .endorsements-grid {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .endorsement-list-item {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: var(--spacing-lg);
            align-items: center;
        }

        .endorsement-list-item .photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--color-secondary);
        }

        .endorsement-list-item .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Forms Section */
        .form-group {
            margin-bottom: var(--spacing-lg);
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--color-text);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: var(--spacing-sm);
            border: 1px solid #ddd;
            border-radius: var(--radius);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: var(--transition-default);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--color-secondary);
            box-shadow: 0 0 0 3px rgba(0, 163, 153, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-section {
            background-color: white;
            padding: var(--spacing-xl);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            max-width: 600px;
        }

        .form-section h3 {
            color: var(--color-primary);
            margin-bottom: var(--spacing-md);
        }

        .form-section p {
            color: var(--color-text-light);
            margin-bottom: var(--spacing-lg);
        }

        .forms-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--spacing-xl);
        }

        /* Footer */
        footer {
            background-color: var(--color-primary);
            color: white;
            padding: var(--spacing-xl) 0;
            text-align: center;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-lg);
            text-align: center;
        }

        .footer-column {
            text-align: center;
        }

        .footer-column h4 {
            margin-bottom: var(--spacing-md);
            font-size: 1rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: var(--spacing-md);
            margin-top: var(--spacing-md);
        }

        .social-link {
            display: inline-flex;
            width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transition: var(--transition-default);
        }

        .social-link:hover {
            background-color: var(--color-accent);
        }

        .social-link svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .social-link:hover svg {
            fill: var(--color-primary);
        }

        .footer-divider {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin: var(--spacing-lg) 0;
            grid-column: 1 / -1;
        }

        .footer-bottom {
            grid-column: 1 / -1;
            font-size: 0.875rem;
            opacity: 0.8;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            position: relative;
            max-width: 900px;
            max-height: 80vh;
        }

        .lightbox-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .lightbox-caption {
            color: white;
            text-align: center;
            margin-top: var(--spacing-md);
            font-size: 0.95rem;
        }

        .lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-default);
        }

        .lightbox-close:hover {
            color: var(--color-accent);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .lightbox-prev, .lightbox-next {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            padding: var(--spacing-md);
            pointer-events: all;
            transition: var(--transition-default);
        }

        .lightbox-prev:hover, .lightbox-next:hover {
            color: var(--color-accent);
        }

        /* Scroll Reveal */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            h2 { font-size: 1.75rem; }
            h3 { font-size: 1.5rem; }

            .hamburger {
                display: flex;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 70px;
                left: 0;
                right: 0;
                flex-direction: column;
                background-color: white;
                padding: var(--spacing-lg);
                gap: var(--spacing-md);
                border-bottom: 1px solid #eee;
            }

            .nav-links.active {
                display: flex;
            }

            .about-content,
            .hero.split-left,
            .hero.split-right {
                grid-template-columns: 1fr;
            }

            .hero.split-right .hero-image {
                order: 0;
            }

            .hero.diagonal .hero-image {
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            }

            .accomplishment-item {
                grid-template-columns: 1fr;
            }

            .accomplishment-item:nth-child(even) {
                direction: ltr;
            }

            .gallery-grid {
                column-count: 2;
            }

            .forms-container {
                grid-template-columns: 1fr;
            }

            .footer-content {
                grid-template-columns: 1fr;
            }

            .hero-headline {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            :root {
                --spacing-lg: 2rem;
                --spacing-xl: 3rem;
                --spacing-2xl: 3rem;
            }

            h1 { font-size: 1.5rem; }
            h2 { font-size: 1.25rem; }
            h3 { font-size: 1.125rem; }

            nav {
                padding: var(--spacing-md);
            }

            .nav-logo {
                font-size: 1.25rem;
            }

            section {
                padding: var(--spacing-lg) 0;
            }

            .gallery-grid {
                column-count: 1;
            }

            .about-stats {
                grid-template-columns: 1fr;
            }

            .hero-headline {
                font-size: 1.5rem;
            }

            .hero-subheadline {
                font-size: 1rem;
            }

            .section-headline {
                font-size: 1.5rem;
            }
        }

        /* Print Styles */
        @media print {
            nav, .lightbox {
                display: none;
            }

            section {
                page-break-inside: avoid;
            }
        }
    </style>
</head>

        };

        let config = null;
        let currentLightboxIndex = 0;
        let allGalleryPhotos = [];

        // Initialize
        async function init() {
            try {
                const response = await fetch('site-config.json');
                config = await response.json();

                applyTheme(config);
                updateMeta(config);
                renderNav(config);
                renderSections(config);
                setupScrollEffects();
                setupLightbox();
            } catch (error) {
                console.error('Error loading config:', error);
                document.getElementById('main').innerHTML = '<div class="container" style="padding: 60px 0;"><h2>Error loading configuration</h2><p>Make sure site-config.json exists in the same directory.</p></div>';
            }
        }

        // Apply Theme
        function applyTheme(config) {
            const root = document.documentElement;
            const style = config.style || {};
            const colors = style.colors || {};

            // Set CSS Variables
            if (colors.primary) root.style.setProperty('--color-primary', colors.primary);
            if (colors.secondary) root.style.setProperty('--color-secondary', colors.secondary);
            if (colors.accent) root.style.setProperty('--color-accent', colors.accent);
            if (colors.background) root.style.setProperty('--color-background', colors.background);
            if (colors.surface) root.style.setProperty('--color-surface', colors.surface);
            if (colors.text) root.style.setProperty('--color-text', colors.text);
            if (colors.textLight) root.style.setProperty('--color-text-light', colors.textLight);
            if (colors.textMuted) root.style.setProperty('--color-text-muted', colors.textMuted);

            // Load Font
            const fontKey = style.fontPairing || 'playfair-source';
            const fontPairing = FONT_PAIRINGS[fontKey] || FONT_PAIRINGS['playfair-source'];

            root.style.setProperty('--font-heading', fontPairing.heading);
            root.style.setProperty('--font-body', fontPairing.body);

            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = fontPairing.url;
            document.head.appendChild(link);
        }

        // Update Meta
        function updateMeta(config) {
            if (config.site) {
                document.title = config.site.candidateName || 'Campaign';
                const meta = document.querySelector('meta[name="description"]');
                if (meta && config.site.metaDescription) {
                    meta.setAttribute('content', config.site.metaDescription);
                }
            }
        }

        // Render Navigation
        function renderNav(config) {
            const nav = config.nav || {};

            document.getElementById('navLogo').textContent = nav.logoText || config.site?.candidateName || 'Campaign';

            const navLinks = document.getElementById('navLinks');
            navLinks.innerHTML = '';

            (nav.links || []).forEach(link => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = link.href;
                a.textContent = link.label;
                a.addEventListener('click', () => {
                    document.getElementById('hamburger').classList.remove('active');
                    document.getElementById('navLinks').classList.remove('active');
                });
                li.appendChild(a);
                navLinks.appendChild(li);
            });

            if (nav.ctaText && nav.ctaLink) {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = nav.ctaLink;
                a.className = 'nav-cta';
                a.textContent = nav.ctaText;
                a.addEventListener('click', () => {
                    document.getElementById('hamburger').classList.remove('active');
                    document.getElementById('navLinks').classList.remove('active');
                });
                li.appendChild(a);
                navLinks.appendChild(li);
            }

            // Hamburger
            document.getElementById('hamburger').addEventListener('click', () => {
                document.getElementById('hamburger').classList.toggle('active');
                document.getElementById('navLinks').classList.toggle('active');
            });
        }

        // Render Sections
        function renderSections(config) {
            const main = document.getElementById('main');
            main.innerHTML = '';

            const order = config.sectionOrder || ['hero', 'about', 'issues', 'accomplishments', 'gallery', 'endorsements', 'volunteer', 'contact', 'footer'];

            order.forEach(sectionType => {
                if (sectionType === 'hero' && config.hero) {
                    main.appendChild(renderHero(config));
                } else if (sectionType === 'about' && config.about) {
                    main.appendChild(renderAbout(config));
                } else if (sectionType === 'issues' && config.issues) {
                    main.appendChild(renderIssues(config));
                } else if (sectionType === 'accomplishments' && config.accomplishments) {
                    main.appendChild(renderAccomplishments(config));
                } else if (sectionType === 'gallery' && config.gallery) {
                    main.appendChild(renderGallery(config));
                } else if (sectionType === 'endorsements' && config.endorsements) {
                    main.appendChild(renderEndorsements(config));
                } else if ((sectionType === 'volunteer' || sectionType === 'contact') && config.forms) {
                    main.appendChild(renderForms(config));
                }
            });

            if (config.footer) {
                document.getElementById('footer').appendChild(renderFooter(config));
            }
        }

        // Render Hero
        function renderHero(config) {
            const hero = config.hero;
            const heroLayout = config.style?.heroLayout || 'full-bleed';

            const section = document.createElement('section');
            section.className = `hero ${heroLayout}`;

            if (['full-bleed', 'centered'].includes(heroLayout) && hero.image) {
                section.style.backgroundImage = `url('${hero.image}')`;
            }

            const container = document.createElement('div');
            container.className = 'hero-container';

            if (['split-left', 'split-right', 'diagonal'].includes(heroLayout)) {
                const imageDiv = document.createElement('div');
                imageDiv.className = 'hero-image';
                if (hero.image) {
                    imageDiv.style.backgroundImage = `url('${hero.image}')`;
                }
                container.appendChild(imageDiv);
            }

            const content = document.createElement('div');
            content.className = 'hero-content';

            if (hero.headline) {
                const h1 = document.createElement('h1');
                h1.className = 'hero-headline';
                h1.textContent = hero.headline;
                content.appendChild(h1);
            }

            if (hero.subheadline) {
                const p = document.createElement('p');
                p.className = 'hero-subheadline';
                p.textContent = hero.subheadline;
                content.appendChild(p);
            }

            if (hero.ctaText && hero.ctaLink) {
                const a = document.createElement('a');
                a.href = hero.ctaLink;
                a.className = 'button';
                a.textContent = hero.ctaText;
                content.appendChild(a);
            }

            container.appendChild(content);
            section.appendChild(container);

            return section;
        }

        // Render About
        function renderAbout(config) {
            const about = config.about;

            const section = document.createElement('section');
            section.className = 'about reveal';

            const container = document.createElement('div');
            container.className = 'container';

            // Header
            const header = document.createElement('div');
            header.className = 'section-header';

            if (about.sectionTitle) {
                const title = document.createElement('div');
                title.className = 'section-title';
                title.textContent = about.sectionTitle;
                header.appendChild(title);
            }

            if (about.headline) {
                const h2 = document.createElement('h2');
                h2.className = 'section-headline';
                h2.textContent = about.headline;
                header.appendChild(h2);
            }

            container.appendChild(header);

            // Content
            const content = document.createElement('div');
            content.className = 'about-content';

            const textDiv = document.createElement('div');
            textDiv.className = 'about-text';

            if (about.body) {
                const bodyDiv = document.createElement('div');
                bodyDiv.innerHTML = about.body;
                textDiv.appendChild(bodyDiv);
            }

            if (about.stats && about.stats.length > 0) {
                const statsDiv = document.createElement('div');
                statsDiv.className = 'about-stats';

                about.stats.forEach(stat => {
                    const statDiv = document.createElement('div');
                    statDiv.className = 'stat';

                    const number = document.createElement('div');
                    number.className = 'stat-number';
                    number.textContent = stat.number;
                    statDiv.appendChild(number);

                    const label = document.createElement('div');
                    label.className = 'stat-label';
                    label.textContent = stat.label;
                    statDiv.appendChild(label);

                    statsDiv.appendChild(statDiv);
                });

                textDiv.appendChild(statsDiv);
            }

            content.appendChild(textDiv);

            if (about.photo) {
                const photoDiv = document.createElement('div');
                photoDiv.className = 'about-photo';

                const img = document.createElement('img');
                img.src = about.photo;
                img.alt = about.headline || 'About';
                photoDiv.appendChild(img);

                content.appendChild(photoDiv);
            }

            container.appendChild(content);
            section.appendChild(container);

            return section;
        }

        // Render Issues
        function renderIssues(config) {
            const issues = config.issues;

            const section = document.createElement('section');
            section.className = 'issues reveal';

            const container = document.createElement('div');
            container.className = 'container';

            // Header
            const header = document.createElement('div');
            header.className = 'section-header';

            if (issues.sectionTitle) {
                const title = document.createElement('div');
                title.className = 'section-title';
                title.textContent = issues.sectionTitle;
                header.appendChild(title);
            }

            if (issues.headline) {
                const h2 = document.createElement('h2');
                h2.className = 'section-headline';
                h2.textContent = issues.headline;
                header.appendChild(h2);
            }

            if (issues.intro) {
                const intro = document.createElement('div');
                intro.className = 'section-intro';
                intro.textContent = issues.intro;
                header.appendChild(intro);
            }

            container.appendChild(header);

            // Grid
            const grid = document.createElement('div');
            grid.className = 'issues-grid';

            (issues.items || []).forEach(item => {
                const card = document.createElement('div');
                card.className = 'issue-card reveal';

                if (item.icon) {
                    const icon = document.createElement('div');
                    icon.className = 'issue-icon';
                    icon.textContent = item.icon;
                    card.appendChild(icon);
                }

                if (item.title) {
                    const h4 = document.createElement('h4');
                    h4.textContent = item.title;
                    card.appendChild(h4);
                }

                if (item.description) {
                    const p = document.createElement('p');
                    p.textContent = item.description;
                    card.appendChild(p);
                }

                grid.appendChild(card);
            });

            container.appendChild(grid);
            section.appendChild(container);

            return section;
        }

        // Render Accomplishments
        function renderAccomplishments(config) {
            const accomplishments = config.accomplishments;

            const section = document.createElement('section');
            section.className = 'accomplishments reveal';

            const container = document.createElement('div');
            container.className = 'container';

            // Header
            const header = document.createElement('div');
            header.className = 'section-header';

            if (accomplishments.sectionTitle) {
                const title = document.createElement('div');
                title.className = 'section-title';
                title.textContent = accomplishments.sectionTitle;
                header.appendChild(title);
            }

            if (accomplishments.headline) {
                const h2 = document.createElement('h2');
                h2.className = 'section-headline';
                h2.textContent = accomplishments.headline;
                header.appendChild(h2);
            }

            if (accomplishments.intro) {
                const intro = document.createElement('div');
                intro.className = 'section-intro';
                intro.textContent = accomplishments.intro;
                header.appendChild(intro);
            }

            container.appendChild(header);

            // Items
            const list = document.createElement('div');
            list.className = 'accomplishments-list';

            (accomplishments.items || []).forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'accomplishment-item reveal';

                const content = document.createElement('div');
                content.className = 'accomplishment-content';

                if (item.title || item.icon) {
                    const h3 = document.createElement('h3');
                    if (item.icon) {
                        const icon = document.createElement('span');
                        icon.className = 'accomplishment-icon';
                        icon.textContent = item.icon;
                        h3.appendChild(icon);
                    }
                    if (item.title) {
                        h3.appendChild(document.createTextNode(item.title));
                    }
                    content.appendChild(h3);
                }

                if (item.body) {
                    const bodyDiv = document.createElement('div');
                    bodyDiv.innerHTML = item.body;
                    content.appendChild(bodyDiv);
                }

                itemDiv.appendChild(content);

                if (item.photo) {
                    const photoDiv = document.createElement('div');
                    photoDiv.className = 'accomplishment-photo';

                    const img = document.createElement('img');
                    img.src = item.photo;
                    img.alt = item.title || 'Accomplishment';
                    photoDiv.appendChild(img);

                    itemDiv.appendChild(photoDiv);
                }

                list.appendChild(itemDiv);
            });

            container.appendChild(list);
            section.appendChild(container);

            return section;
        }

        // Render Gallery
        function renderGallery(config) {
            const gallery = config.gallery;
            allGalleryPhotos = gallery.photos || [];

            const section = document.createElement('section');
            section.className = 'gallery reveal';

            const container = document.createElement('div');
            container.className = 'container';

            // Header
            const header = document.createElement('div');
            header.className = 'section-header';

            if (gallery.sectionTitle) {
                const title = document.createElement('div');
                title.className = 'section-title';
                title.textContent = gallery.sectionTitle;
                header.appendChild(title);
            }

            if (gallery.headline) {
                const h2 = document.createElement('h2');
                h2.className = 'section-headline';
                h2.textContent = gallery.headline;
                header.appendChild(h2);
            }

            container.appendChild(header);

            // Grid
            const grid = document.createElement('div');
            grid.className = 'gallery-grid';

            (gallery.photos || []).forEach((photo, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.style.cursor = 'pointer';

                const img = document.createElement('img');
                img.src = photo.src;
                img.alt = photo.alt || `Gallery photo ${index + 1}`;

                item.appendChild(img);
                item.addEventListener('click', () => openLightbox(index));

            container.appendChild(grid);
            section.appendChild(container);

        // Setup Scroll Effects
        function setupScrollEffects() {
            // Nav Shadow on Scroll
            window.addEventListener('scroll', () => {
                const nav = document.getElementById('nav');
                if (window.scrollY > 0) {
                    nav.classList.add('scrolled');
                } else {
                    nav.classList.remove('scrolled');
                }
            });

            // Scroll Reveal
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.reveal').forEach(el => {
                observer.observe(el);
            });
        }

        // Lightbox
        function setupLightbox() {
            const lightbox = document.getElementById('lightbox');
            const lightboxImage = document.getElementById('lightboxImage');
            const lightboxCaption = document.getElementById('lightboxCaption');
            const lightboxClose = document.getElementById('lightboxClose');
            const lightboxPrev = document.getElementById('lightboxPrev');
            const lightboxNext = document.getElementById('lightboxNext');

            lightboxClose.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });

            lightboxPrev.addEventListener('click', () => {
                currentLightboxIndex = (currentLightboxIndex - 1 + allGalleryPhotos.length) % allGalleryPhotos.length;
                updateLightbox();
            });

            lightboxNext.addEventListener('click', () => {
                currentLightboxIndex = (currentLightboxIndex + 1) % allGalleryPhotos.length;
                updateLightbox();
            });

            document.addEventListener('keydown', (e) => {
                if (lightbox.classList.contains('active')) {
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowLeft') lightboxPrev.click();
                    if (e.key === 'ArrowRight') lightboxNext.click();
                }
            });
        }

        function openLightbox(index) {
            currentLightboxIndex = index;
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function updateLightbox() {
            const photo = allGalleryPhotos[currentLightboxIndex];
            document.getElementById('lightboxImage').src = photo.src;
            document.getElementById('lightboxCaption').textContent = photo.caption || photo.alt || '';
        }

        // Start
        init();
